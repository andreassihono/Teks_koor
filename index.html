<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Teks Koor</title>


<script src="https://net/npm/page-flip/dist/js/page-flip.browser.min.jsscript">

<style>
body{
    margin:0;
    padding:20px;
    background:#dcdcdc;
    display:flex;
    justify-content:center;
}

#book{
    width:1200px;
    height:800px;
}

.page{
    background:white;
}

canvas{
    width:100%;
    height:100%;
}
</style>
</head>

<body>

<div id="book"></div>

<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

async function loadPDF() {

    const pdf = await pdfjsLib
        .getDocument('Daftar%20Lagu%20Misa.pdf')
        .promise;

    const book = document.getElementById('book');
    const pages = [];

    for(let i = 1; i <= pdf.numPages; i++){

        const page = await pdf.getPage(i);
        const viewport = page.getViewport({ scale: 2 });

        const canvas = document.createElement('canvas');
        const context = canvas.getContext('2d');

        canvas.width = viewport.width;
        canvas.height = viewport.height;

        await page.render({
            canvasContext: context,
            viewport: viewport
        }).promise;

        const div = document.createElement('div');
        div.className = 'page';
        div.appendChild(canvas);

        pages.push(div);
    }

    pages.forEach(p => book.appendChild(p));

    const flipBook = new St.PageFlip(book,{
        width:600,
        height:800,
        showCover:true,
        mobileScrollSupport:true,
        maxShadowOpacity:0.5
    });

    flipBook.loadFromHTML(
        document.querySelectorAll('.page')
    );
}

loadPDF();

</script>

</body>
</html>
