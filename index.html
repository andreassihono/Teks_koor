<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teks Koor Flipbook</title>

<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>

<style>
body{margin:0;background:#d9d9d9;font-family:Arial;display:flex;flex-direction:column;align-items:center}
.toolbar{padding:10px;background:#222;width:100%;text-align:center}
button{padding:10px 20px;margin:5px;font-size:16px}
#book{width:1200px;max-width:100%;height:800px;margin-top:10px}
.page{background:white}
canvas{width:100%;height:100%}
</style>
</head>
<body>
<div class="toolbar">
<button id="prev">◀ Prev</button>
<button id="next">Next ▶</button>
</div>
<div id="book"></div>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
async function loadBook(){
const pdf=await pdfjsLib.getDocument('Daftar%20Lagu%20Misa.pdf').promise;
const container=document.getElementById('book');
const pages=[];
for(let i=1;i<=pdf.numPages;i++){
 const page=await pdf.getPage(i);
 const viewport=page.getViewport({scale:2});
 const canvas=document.createElement('canvas');
 const ctx=canvas.getContext('2d');
 canvas.width=viewport.width; canvas.height=viewport.height;
 await page.render({canvasContext:ctx,viewport:viewport}).promise;
 const div=document.createElement('div');
 div.className='page'; div.appendChild(canvas); pages.push(div);
}
pages.forEach(p=>container.appendChild(p));
 const flipBook=new St.PageFlip(container,{width:400,height:600,size:"stretch",showCover:true,mobileScrollSupport:true,maxShadowOpacity:0.5,useMouseEvents:true});
 flipBook.loadFromHTML(document.querySelectorAll('.page'));
document.getElementById('next').addEventListener('click',()=>flipBook.flipNext());
document.getElementById('prev').addEventListener('click',()=>flipBook.flipPrev());
}
loadBook();
</script>
</body>
</html>
